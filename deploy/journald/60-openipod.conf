# Example for a dedicated player device. These limits cover the entire default
# system journal, not only OpeniPod. Review them before installing on a desktop.
# Provisional defaults for #6/#7; tune for the device's storage and log volume
# later, as agreed in #6. These are not final hardware requirements.
[Journal]
Storage=persistent
# Bound retained diagnostics while reserving space for other device data.
SystemMaxUse=64M
SystemKeepFree=128M
SystemMaxFileSize=8M
# Bound the volatile journal if persistent storage is unavailable.
RuntimeMaxUse=16M
MaxRetentionSec=7day
ForwardToConsole=no

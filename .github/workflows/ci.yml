name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check and build
        run: make all
